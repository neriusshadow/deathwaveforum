{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Вход{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-body">
                <h2 class="card-title mb-4">Войти</h2>
                <form method="post" action="{% url 'account_login' %}">
                    {% csrf_token %}
                    {{ form|crispy }}
                    {% if redirect_field_value %}
                    <input type="hidden" name="{{ redirect_field_name }}" value="{{ redirect_field_value }}" />
                    {% endif %}
                    <div class="mt-4">
                        <button class="btn btn-primary" type="submit">Войти</button>
                        <a href="{% url 'account_reset_password' %}" class="btn btn-link">Забыли пароль?</a>
                    </div>
                </form>
                <p class="mt-3">Если у вас еще нет учетной записи, пожалуйста, <a href="{% url 'account_signup' %}">зарегистрируйтесь</a>.</p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
